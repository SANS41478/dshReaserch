<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepSeek Harness · 全量解构</title>
<meta name="description" content="DeepSeek Harness（dsh）全量架构解构：319 个包、能力接缝、事件矩阵、工具目录与逐包源码精读。">
<meta name="theme-color" content="#F7F7F7">
<link rel="stylesheet" href="assets/fonts/noto-sans-sc.css">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/source.css">
<link rel="stylesheet" href="assets/responsive.css">
</head>
<body>
<a class="skip" href="#content">跳到主内容</a>

<div id="app">
  <header class="site-head">
    <div class="head-inner">
      <a class="brand" href="#/" aria-label="DeepSeek Harness 首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 20 20" width="20" height="20" fill="none" aria-hidden="true">
            <rect x="1" y="1" width="8" height="8" fill="currentColor"/>
            <rect x="11" y="1" width="8" height="8" fill="currentColor"/>
            <rect x="1" y="11" width="8" height="8" fill="currentColor"/>
            <rect x="11" y="11" width="8" height="8" fill="#0B66D6"/>
          </svg>
        </span>
        <span class="brand-txt">
          <strong>DeepSeek Harness</strong>
          <span>ARCHIVE / 全量架构解构</span>
        </span>
      </a>

      <nav class="nav" aria-label="主导航">
        <a href="#/" data-nav="home">首页</a>
        <a href="#/map" data-nav="map">全站地图</a>
        <a href="#/seams" data-nav="seams">能力接缝</a>
        <a href="#/events" data-nav="events">事件矩阵</a>
        <a href="#/tools" data-nav="tools">工具目录</a>
        <a href="#/about" data-nav="about">关于</a>
      </nav>

      <div class="head-actions">
        <span class="head-meta" id="head-meta">ARCHIVE / 319 PKGS</span>
        <a class="btn btn-ink head-source" id="head-source" href="#/files">源码浏览器</a>
        <button id="nav-toggle" class="icon-btn nav-toggle" type="button" aria-label="打开目录" aria-expanded="false" aria-controls="sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <div id="shell">
    <aside id="sidebar" aria-label="目录索引">
      <div class="index-head">
        <div class="index-title">
          <span class="eyebrow">CATALOG / 目录索引</span>
          <b>DeepSeek Harness</b>
        </div>
        <button id="side-close" class="icon-btn side-close" type="button" aria-label="关闭目录">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
            <path d="M6 6l12 12M18 6 6 18"/>
          </svg>
        </button>
      </div>

      <div class="search-wrap">
        <input id="search" type="search" placeholder="搜索包 / 服务 / 事件 / 工具…" autocomplete="off" aria-label="站内搜索">
        <kbd class="search-kbd" aria-hidden="true">/</kbd>
        <div id="search-results" class="search-results" hidden></div>
      </div>

      <nav id="nav" aria-label="目录"></nav>
      <nav id="nav-src" aria-label="源码入口"></nav>

      <div class="side-foot">
        <a href="#/about">关于本站 · 数据来源</a>
      </div>
    </aside>

    <main id="main">
      <div id="content" tabindex="-1"></div>

      <div id="pane-split" class="pane-split" role="separator" aria-label="拖动调整宽度" title="拖动调整宽度 · 双击恢复默认">
        <span class="ps-grip"></span>
      </div>

      <aside id="pane" aria-label="源码侧栏">
        <div class="pane-head">
          <div class="pane-tabs" id="pane-tabs"></div>
          <div class="pane-acts">
            <button id="pane-wide" title="全屏（只看源码）" aria-label="全屏查看源码">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/>
              </svg>
            </button>
            <button id="pane-close" title="收起侧栏（Esc）" aria-label="收起源码侧栏">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
                <path d="M6 6l12 12M18 6 6 18"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="pane-body" id="pane-body"></div>
      </aside>
    </main>
  </div>

  <div id="side-backdrop" class="side-backdrop" hidden></div>

  <button id="menu-toggle" aria-label="返回目录">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
      <path d="M4 7h16M4 12h16M4 17h16"/>
    </svg>
  </button>
</div>

<script src="data/bundle.js"></script>
<script src="assets/source.js"></script>
<script src="assets/deepfmt.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
